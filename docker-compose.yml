version: '3.9'

services:
  postgres:
    image: postgres:16
    container_name: blogs_tool_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-blogs_tool}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: blogs_tool_redis
    restart: unless-stopped
    ports:
      - '6379:6379'

  landing:
    build:
      context: ./apps/landing
      dockerfile: Dockerfile
    container_name: blogs_tool_landing
    restart: unless-stopped
    ports:
      - '3002:3000'
    environment:
      - NEXT_PUBLIC_API_URL=${API_URL:-http://localhost:3001}

volumes:
  postgres_data:

name: CI – Site Template

on:
  push:
    paths:
      - 'apps/site-template/**'
  pull_request:
    paths:
      - 'apps/site-template/**'

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/site-template

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/site-template/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build with mock data
        run: npm run build:mock

name: CI – Backoffice

on:
  push:
    paths:
      - 'apps/backoffice/**'
  pull_request:
    paths:
      - 'apps/backoffice/**'
  workflow_dispatch:

jobs:
  lint-and-build:
    name: Lint & Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/backoffice

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/backoffice/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
